<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacja paliw</title>
    <link rel="stylesheet" href="styl2.css">
</head>

<body>
    <div id="baner">
        <h1>Calodobowa stacja paliw</h1>
    </div>
    <div id="menu">
        <a href="stacja.html" class="odnosnik">
            <img src="home.png" alt="home">
        </a>
        <a href="obliczenia.html" class="odnosnik">
            <img src="znak.png" alt="znak">
        </a>
        <a href="kwerendy.txt" class="odnosnik">
            Pobierz dokumenty
        </a>
    </div>
    <div id="lewy">
        <h2>Orientacyjny koszt paliwa</h2>
        Rodzaj paliwa (1-benzyna, 2-olej napedowy)<br>
        <input type="number" id="rodzaj"><br>
        Ile litrow?<br>
        <input type="number" id="ile"><br>
        <button onclick="dzialanie()">Oblicz</button>
        <p id="wartosc"></p>
    </div>
    <div id="prawy">
        <img src="samochod.png" alt="samochod" id="samochod">
    </div>
    <div id="stopka">
        <a>Strone opracowal XYZ</a>
    </div>

    <script>
        function dzialanie() {
            let rodzaj = Number(document.getElementById("rodzaj").value)
            let ile = Number(document.getElementById("ile").value)
            let wartosc = 0

            if (rodzaj === 1) {
                wartosc += 4
            if(ile > 1){
                wartosc *= ile
            }
            } else {
                wartosc === 0
            }

            if (rodzaj === 2) {
                wartosc += 3.5
            if(ile > 1){
                wartosc *= ile
            }
            } else {
                wartosc === 0
            }

            let wynik = document.getElementById("wartosc");
            document.getElementById("wartosc").innerHTML=`koszt paliwa ${wartosc} zl`;
        }
    </script>
</body>

</html>
