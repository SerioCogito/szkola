<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    podaj metraz: <input type="number" id="metraz"><br>
    podaj powiezchnie podlogi: <input type="number" id="podloga"><br>

    <input type="checkbox" id="kafelki">Kafelki?<br>
    <button type="button" onclick="dzialanie()">oblicz</button>
    <p id="wynik"></p>

    <script>
        function dzialanie(){
            let metraz = Number(document.getElementById("metraz").value); /* "number" jest bardziej sczegulowy od "parseFloat" */
            let podloga = Number(document.getElementById("podloga").value);
            let kafelki = document.getElementById("kafelki").checked; /* nie dajemy number/parse bo to nie jest pole  */
            let koszt = 0;

            koszt += metraz * 4000;
            koszt += podloga * 1000;

            if (kafelki === true){
                koszt += 2000;
            }
            
            let wynik = document.getElementById("wynik"); /* let "nazwa" sekcji dla ktorej bedzie dzialal "css" */
            wynik.style.color = "green";
            wynik.style.fontSize = "25px";


            document.getElementById("wynik").innerHTML = 
            `koszt mieszkania:${koszt}zl`;
            
        }
    </script>


</body>
</html>
